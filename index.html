
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Theatre Ticket Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>City Theatre</h1>
        <p>Interactive Ticket Booking System</p>
    </header>

    
<main>
    <h2>Choose Your Seat</h2>

    <section class="theatre">
        <div class="stage">STAGE</div>

        <h3>VIP Section - 45 AZN</h3>
        <div id="vip-seats"></div>

        <h3>Standard Section - 30 AZN</h3>
        <div id="standard-seats"></div>

        <h3>Economy Section - 20 AZN</h3>
        <div id="economy-seats"></div>
    </section>

    <section class="details">
        <h2>Seat Details</h2>
        <p id="seat-info">No seat selected</p>
        <button id="add-to-cart" disabled>ADD TO CART</button>
    </section>

    <section class="cart">
        <h2>Your Cart</h2>
        <div id="cart-items"></div>
        <p>Total: <span id="total">0</span> AZN</p>
    </section>
</main>


</body>
</html>
